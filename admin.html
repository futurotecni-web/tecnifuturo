<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · TecniFuturo & Tokio Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='28' font-size='28'>⚙️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a1628;--cyan:#00d4ff;--teal:#00e5a0;--red:#e5202e;--gold:#c8a84e;--bg:#f0f4f8;--card:rgba(255,255,255,.85);--text:#0f172a;--text2:#475569;--text3:#94a3b8;--r:14px;--shadow:0 4px 24px -4px rgba(0,0,0,.08);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;border:none;font:inherit}img{max-width:100%;display:block}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
.login-wrap .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;pointer-events:none}
.login-box{background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:40px;max-width:380px;width:90%;text-align:center;box-shadow:0 24px 64px -12px rgba(0,0,0,.3);position:relative;z-index:2}
.login-box img{width:80px;height:80px;border-radius:16px;object-fit:contain;margin:0 auto 16px}
.login-box h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--text2);margin-bottom:20px}
.login-box input{width:100%;padding:14px;border:2px solid rgba(0,0,0,.08);border-radius:12px;font-size:16px;text-align:center;margin-bottom:12px;background:rgba(255,255,255,.6);transition:border-color .2s}
.login-box input:focus{outline:none;border-color:var(--cyan)}
.btn-login{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--teal));color:var(--navy);font-weight:700;font-size:15px;transition:transform .2s}
.btn-login:hover{transform:translateY(-2px)}
.login-back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text3);margin-top:16px;background:none;text-decoration:none}

/* SHELL */
.shell{display:none;height:100vh;overflow:hidden}
.shell.active{display:flex}
.sidebar{width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{padding:16px 20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:11px;opacity:.5;margin-top:3px}
.sidebar-nav{flex:1;padding:10px 0}
.sidebar-nav button{width:100%;text-align:left;padding:11px 20px;background:none;color:rgba(255,255,255,.6);font-size:13.5px;display:flex;align-items:center;gap:10px;transition:all .15s}
.sidebar-nav button:hover,.sidebar-nav button.on{background:rgba(255,255,255,.07);color:#fff}
.sidebar-nav button.on{border-left:3px solid var(--cyan)}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-foot a{color:rgba(255,255,255,.4);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:4px}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar-admin{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,.05)}
.topbar-admin h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.topbar-admin span{font-size:12px;color:var(--text3)}
.content{flex:1;padding:20px 24px;overflow-y:auto}

/* CARDS */
.acard{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.acard h3{font-size:15px;font-weight:700;margin-bottom:14px}

/* TABLE */
.atable{width:100%;border-collapse:collapse}
.atable th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);padding:8px;border-bottom:2px solid rgba(0,0,0,.06);text-transform:uppercase;letter-spacing:.3px}
.atable td{padding:8px;border-bottom:1px solid rgba(0,0,0,.03);font-size:13px}
.atable tr:hover{background:rgba(0,212,255,.03)}
.atable img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.brand-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;color:#fff}
.brand-tag.tf{background:var(--navy)}.brand-tag.tk{background:var(--red)}

/* ACTIONS */
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.abtn{padding:8px 16px;border-radius:10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.abtn:hover{transform:translateY(-1px)}
.abtn--p{background:var(--navy);color:#fff}.abtn--s{background:var(--teal);color:#fff}
.abtn--d{background:var(--red);color:#fff}.abtn--o{background:rgba(0,0,0,.04);color:var(--text)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px 12px;border:1px solid rgba(0,0,0,.08);border-radius:10px;font-size:12.5px;background:rgba(255,255,255,.7)}
.filters input{min-width:180px;flex:1}

/* MODAL */
.amodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.amodal-bg.open{display:flex}
.amodal{background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.4);border-radius:16px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
.amodal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:4px;color:var(--text2)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.08);border-radius:10px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.7)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{padding:16px;text-align:center}
.stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}
.stat-card .num.c1{color:var(--cyan)}.stat-card .num.c2{color:var(--teal)}.stat-card .num.c3{color:var(--red)}
.stat-card .lbl{font-size:11.5px;color:var(--text3);margin-top:2px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}

@media(max-width:768px){
.sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:50;transition:left .3s}.sidebar.open{left:0}
.mob-toggle{display:block!important}
}
.mob-toggle{display:none;position:fixed;top:10px;left:10px;z-index:60;background:var(--navy);color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;align-items:center;justify-content:center}
</style>
</head>

</div>

<script>
const CODES={'1110465604':'gerencia','g3r3nc14':'gerencia','c4j3r4':'cajera','4s3s0r':'asesor'};
const SUPA={url:'https://ubihlrohxloxwoinbabc.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViaWhscm9oeGxveHdvaW5iYWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMTIzNDMsImV4cCI6MjEwODg4ODM0M30.u3z2lT7TFG-KvqLUQBJcHGqzQFssgyP4uVkwpWsKNus'};
let products=JSON.parse(localStorage.getItem('tfts_products')||'[]');
let categories=JSON.parse(localStorage.getItem('tfts_categories')||'[]');
let sales=JSON.parse(localStorage.getItem('tfts_sales')||'[]');
let role='';
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem('tfts_products',JSON.stringify(products));localStorage.setItem('tfts_categories',JSON.stringify(categories));localStorage.setItem('tfts_sales',JSON.stringify(sales))}
function fmt(n){return'$'+Number(n||0).toLocaleString('es-CO')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

/* LOGIN */
function doLogin(){const doc=$('loginDoc').value.trim();const r=CODES[doc];if(!r){toast('Documento incorrecto');return}role=r;$('userLabel').textContent=r.charAt(0).toUpperCase()+r.slice(1);$('loginWrap').style.display='none';$('shell').classList.add('active');tab('inventario',document.querySelector('.sidebar-nav button'))}

/* TABS */
function tab(t,btn){document.querySelectorAll('.sidebar-nav button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');$('tabTitle').textContent=t.charAt(0).toUpperCase()+t.slice(1);if(t==='inventario')renderInv();else if(t==='ventas')renderSales();else if(t==='carga')renderBulk();else if(t==='ajustes')renderSettings();document.getElementById('sidebar').classList.remove('open')}

/* INVENTORY */
let editP=null;
function renderInv(){
const c=$('tabContent');
const tf=products.filter(p=>p.brand==='tecnifuturo'&&!p.hidden);
const tk=products.filter(p=>p.brand==='tokio'&&!p.hidden);
const out=products.filter(p=>p.stock<=0);
c.innerHTML=`<div class="stat-grid">
<div class="acard stat-card"><div class="num c1">${products.length}</div><div class="lbl">Total productos</div></div>
<div class="acard stat-card"><div class="num c2">${tf.length}</div><div class="lbl">TecniFuturo</div></div>
<div class="acard stat-card"><div class="num c3">${tk.length}</div><div class="lbl">Tokio Store</div></div>
<div class="acard stat-card"><div class="num c3">${out.length}</div><div class="lbl">Agotados</div></div>
</div>
<div class="actions">
<button class="abtn abtn--p" onclick="openProdForm()">+ Nuevo producto</button>
<button class="abtn abtn--o" onclick="openCatForm()">+ Categoría</button>
<button class="abtn abtn--o" onclick="syncCloud()">☁️ Sincronizar</button>
</div>
<div class="acard"><div class="filters">
<select id="fBrand" onchange="renderInvTable()"><option value="">Todas las marcas</option><option value="tecnifuturo">TecniFuturo</option><option value="tokio">Tokio Store</option></select>
<select id="fCat" onchange="renderInvTable()"><option value="">Categorías</option>${categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select>
<input id="fSearch" placeholder="Buscar..." oninput="renderInvTable()">
</div>
<div style="overflow-x:auto"><table class="atable"><thead><tr><th>Foto</th><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div></div>`;
setTimeout(renderInvTable,0)}

function renderInvTable(){
let items=[...products];
const fb=document.getElementById('fBrand');if(fb&&fb.value)items=items.filter(p=>p.brand===fb.value);
const fc=document.getElementById('fCat');if(fc&&fc.value)items=items.filter(p=>p.category===fc.value);
const fs=document.getElementById('fSearch');if(fs&&fs.value)items=items.filter(p=>p.name.toLowerCase().includes(fs.value.toLowerCase()));
const b=document.getElementById('invBody');if(!b)return;
b.innerHTML=items.map(p=>`<tr>
<td>${p.image?`<img src="${p.image}">`:'📦'}</td>
<td style="font-weight:600">${p.name}</td>
<td><span class="brand-tag ${p.brand==='tecnifuturo'?'tf':'tk'}">${p.brand==='tecnifuturo'?'TF':'TS'}</span></td>
<td>${p.category||''}</td>
<td>${fmt(p.salePrice||p.price)}</td>
<td>${p.stock}</td>
<td><button class="abtn abtn--o" onclick="editProd(${p.id})" style="padding:4px 10px">✏️</button>
<button class="abtn abtn--d" onclick="deleteProd(${p.id})" style="padding:4px 10px">🗑️</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text3)">Sin productos</td></tr>'}

function openProdForm(p){editP=p||null;const m=document.createElement('div');m.className='amodal-bg open';m.id='prodModal';m.onclick=function(e){if(e.target===this)this.remove()};
m.innerHTML=`<div class="amodal"><h3>${p?'Editar':'Nuevo'} producto</h3>
<div class="field"><label>Marca</label><select id="pBrand"><option value="tecnifuturo" ${p?.brand==='tokio'?'':'selected'}>TecniFuturo</option><option value="tokio" ${p?.brand==='tokio'?'selected':''}>Tokio Store</option></select></div>
<div class="field"><label>Nombre</label><input id="pName" value="${(p?.name||'').replace(/"/g,'&quot;')}"></div>
<div class="row2"><div class="field"><label>Precio</label><input type="number" id="pPrice" value="${p?.price||''}"></div>
<div class="field"><label>Stock</label><input type="number" id="pStock" value="${p?.stock??0}"></div></div>
<div class="field"><label>Categoría</label><select id="pCat">${categories.map(c=>`<option value="${c.name}" ${p?.category===c.name?'selected':''}>${c.name} (${c.brand==='tecnifuturo'?'TF':'TS'})</option>`).join('')}</select></div>
<div class="field"><label>Precio oferta</label><input type="number" id="pSale" value="${p?.salePrice||''}"></div>
<div class="field"><label>Imagen URL</label><input id="pImg" value="${(p?.image||'').replace(/"/g,'&quot;')}"></div>
<div class="field"><label>Descripción</label><textarea id="pDesc">${p?.description||''}</textarea></div>
<div class="row2"><div class="field"><label>SKU</label><input id="pSKU" value="${p?.sku||''}"></div>
<div class="field"><label>Etiqueta</label><select id="pBadge"><option value="">Sin etiqueta</option><option ${p?.badge==='Nuevo'?'selected':''}>Nuevo</option><option ${p?.badge==='Oferta'?'selected':''}>Oferta</option><option ${p?.badge==='Más vendido'?'selected':''}>Más vendido</option></select></div></div>
<div class="form-actions"><button class="abtn abtn--o" onclick="document.getElementById('prodModal').remove()">Cancelar</button>
<button class="abtn abtn--p" onclick="saveProd()">Guardar</button></div></div>`;
document.body.appendChild(m)}

function saveProd(){const d={brand:$('pBrand').value,name:$('pName').value.trim(),price:Number($('pPrice').value),stock:Number($('pStock').value),category:$('pCat').value,salePrice:Number($('pSale').value)||null,image:$('pImg').value.trim(),description:$('pDesc').value.trim(),sku:$('pSKU').value.trim(),badge:$('pBadge').value||null,hidden:false};
if(!d.name){toast('Escribe el nombre');return}
if(editP)Object.assign(editP,d);else{d.id=Date.now();products.push(d)}
save();document.getElementById('prodModal').remove();renderInv();toast('Producto guardado')}

function editProd(id){const p=products.find(x=>x.id===id);if(p)openProdForm(p)}
function deleteProd(id){if(!confirm('¿Eliminar?'))return;products=products.filter(p=>p.id!==id);save();renderInv();toast('Eliminado')}

function openCatForm(){const m=document.createElement('div');m.className='amodal-bg open';m.id='catModal';m.onclick=function(e){if(e.target===this)this.remove()};
m.innerHTML=`<div class="amodal" style="max-width:340px"><h3>Nueva categoría</h3>
<div class="field"><label>Marca</label><select id="catBrand"><option value="tecnifuturo">TecniFuturo</option><option value="tokio">Tokio Store</option></select></div>
<div class="field"><label>Nombre</label><input id="catName"></div>
<div class="form-actions"><button class="abtn abtn--o" onclick="document.getElementById('catModal').remove()">Cancelar</button>
<button class="abtn abtn--p" onclick="saveCat()">Guardar</button></div></div>`;
document.body.appendChild(m)}
function saveCat(){const n=$('catName').value.trim(),b=$('catBrand').value;if(!n){toast('Escribe nombre');return}if(categories.find(c=>c.name===n&&c.brand===b)){toast('Ya existe');return}categories.push({name:n,brand:b});save();document.getElementById('catModal').remove();toast('Categoría creada')}

/* SALES */
function renderSales(){const c=$('tabContent');c.innerHTML=`<div class="acard"><h3>Historial de ventas</h3>
<div class="actions"><button class="abtn abtn--o" onclick="exportCSV()">📤 Exportar CSV</button></div>
<div style="overflow-x:auto"><table class="atable"><thead><tr><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th></tr></thead>
<tbody>${[...sales].reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString('es-CO')}</td><td>${s.customer||'-'}</td><td>${s.items.map(i=>i.name+' x'+i.qty).join(', ')}</td><td>${fmt(s.total)}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text3)">Sin ventas</td></tr>'}</tbody></table></div></div>`}
function exportCSV(){let csv='Fecha,Cliente,Teléfono,Productos,Total\n';sales.forEach(s=>{csv+=`"${s.date}","${s.customer||''}","${s.phone||''}","${s.items.map(i=>i.name+' x'+i.qty).join('; ')}",${s.total}\n`});const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ventas_tfts.csv';a.click()}

/* BULK */
function renderBulk(){$('tabContent').innerHTML=`<div class="acard"><h3>Cargar productos desde CSV</h3>
<p style="font-size:13px;color:var(--text2);margin-bottom:14px">Columnas: marca, nombre, categoria, precio, precio_oferta, stock, descripcion, imagen_url, badge</p>
<input type="file" id="csvFile" accept=".csv" onchange="previewCSV()" style="margin-bottom:12px">
<button class="abtn abtn--o" onclick="dlTemplate()">📥 Descargar plantilla</button>
<div id="csvPrev"></div></div>`}
function dlTemplate(){const c='marca,nombre,categoria,precio,precio_oferta,stock,descripcion,imagen_url,badge\ntecnifuturo,Cargador USB-C 20W,Cargadores,25000,,10,,,Nuevo';const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='plantilla_tfts.csv';a.click()}
function previewCSV(){const f=$('csvFile').files[0];if(!f)return;const r=new FileReader();r.onload=function(e){const lines=e.target.result.split('\n').filter(l=>l.trim());if(lines.length<2)return;const h=lines[0].split(',').map(x=>x.trim().toLowerCase());const rows=lines.slice(1).map(l=>{const v=l.split(',');const o={};h.forEach((k,i)=>o[k]=v[i]?.trim()||'');return o});$('csvPrev').innerHTML=`<p style="margin:12px 0"><strong>${rows.length}</strong> productos</p><button class="abtn abtn--p" onclick="importCSV()">✅ Importar</button>`;window._csv=rows};r.readAsText(f)}
function importCSV(){if(!window._csv)return;window._csv.forEach(r=>{products.push({id:Date.now()+Math.random()*1000|0,brand:r.marca||'tecnifuturo',name:r.nombre||'',category:r.categoria||'',price:Number(r.precio)||0,salePrice:Number(r.precio_oferta)||null,stock:Number(r.stock)||0,description:r.descripcion||'',image:r.imagen_url||'',badge:r.badge||null,hidden:false})});save();toast('Importados');tab('inventario',document.querySelector('.sidebar-nav button'))}

/* SETTINGS */
function renderSettings(){$('tabContent').innerHTML=`
<div class="acard"><h3>Respaldo</h3><p style="font-size:13px;color:var(--text2);margin-bottom:12px">Descarga copia completa de productos, categorías y ventas.</p>
<button class="abtn abtn--p" onclick="downloadBackup()">📥 Descargar respaldo</button>
<input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup()">
<button class="abtn abtn--o" onclick="document.getElementById('restoreFile').click()" style="margin-left:6px">📤 Restaurar</button></div>

<div class="acard"><h3>Exportar catálogo</h3>
<button class="abtn abtn--o" onclick="exportCatalog()">📤 CSV del catálogo</button></div>

<div class="acard"><h3>Restablecer stock</h3><p style="font-size:13px;color:var(--text2);margin-bottom:12px">Pone todo el stock en 0.</p>
<button class="abtn abtn--d" onclick="if(confirm('¿Restablecer stock a 0?')){products.forEach(p=>p.stock=0);save();toast('Stock en 0')}">Restablecer a 0</button></div>

<div class="acard"><h3>Sincronizar con la nube</h3><p style="font-size:13px;color:var(--text2);margin-bottom:12px">Sube el catálogo actual a Supabase para que los clientes lo vean.</p>
<button class="abtn abtn--s" onclick="syncCloud()">☁️ Subir a la nube</button></div>`}

function downloadBackup(){const d={products,categories,sales,v:'TFTS',date:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_tfts_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restoreBackup(){const f=$('restoreFile').files[0];if(!f)return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);if(d.products)products=d.products;if(d.categories)categories=d.categories;if(d.sales)sales=d.sales;save();toast('Restaurado');renderInv()}catch(err){toast('Error en archivo')}};r.readAsText(f)}
function exportCatalog(){let c='marca,nombre,categoria,precio,precio_oferta,stock,sku\n';products.forEach(p=>{c+=`"${p.brand}","${p.name}","${p.category}",${p.price},${p.salePrice||''},${p.stock},"${p.sku||''}"\n`});const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='catalogo_tfts.csv';a.click()}

/* SUPABASE SYNC */
async function syncCloud(){
try{
toast('Subiendo...');
const catalog={products:products.filter(p=>!p.hidden),categories,updated:new Date().toISOString()};
const r=await fetch(SUPA.url+'/rest/v1/ep_store',{
method:'POST',
headers:{'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
body:JSON.stringify({path:'public/catalog',data:catalog})
});
if(r.ok)toast('✅ Catálogo en la nube');
else toast('Error: '+r.status);
}catch(e){toast('Sin conexión')}
}
</script>
</body>
</html>
